<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استكمال الملف الشخصي</title>
<style>
:root { --dark-bg: #121212; --card-bg: #1f1f1f; --gold: #ffc107; --blue-royal: #4a6fa5; --white: #e0e0e0; --border-color: #333; --red: #cf6679; --green: #4caf50; }
body { background-color: var(--dark-bg); color: var(--white); font-family:'Segoe UI', sans-serif; margin:0; padding:0; direction:rtl; }
.header-controls { display:flex; justify-content:flex-end; padding:15px; background:#1f1f1f; border-bottom:1px solid var(--border-color); }
.btn-back { background-color:var(--blue-royal); color:#fff; padding:8px 15px; border-radius:6px; text-decoration:none; }
.profile-form-container { max-width: 600px; margin: 40px auto; padding: 30px; background-color: var(--card-bg); border-radius: 12px; border:1px solid var(--gold); }
.profile-img-preview { width:120px;height:120px;border-radius:50%;object-fit:cover;border:3px solid var(--blue-royal);background-color:#333;display:block;margin:0 auto 20px;}
input,textarea,select{ width:100%; padding:12px; border:1px solid var(--blue-royal); border-radius:6px; background-color:#2a2a2a; color:var(--white); margin-bottom:10px; }
input:focus,textarea:focus,select:focus{ border-color:var(--gold); outline:none; }
.btn-submit{ width:100%; padding:10px; background-color: var(--gold); border:none; border-radius:6px; color:var(--dark-bg); font-weight:bold; cursor:pointer; }
.btn-submit:hover{ background-color:#e0a800; }
#statusBox{ padding:15px; margin-top:15px; text-align:center; font-weight:bold; border-radius:6px; display:none; }
</style>
</head>
<body>
<div class="header-controls"><a href="index.html" class="btn-back">🔙 الرئيسية</a></div>
<div class="profile-form-container">
    <h1 style="color:var(--gold);">استكمال البيانات</h1>
    <p id="roleInfo" style="color: var(--blue-royal); font-weight: bold;"></p>
    <form id="completionForm">
        <img id="imagePreview" class="profile-img-preview" src="images/guide_man.png">
        <div class="form-group"><label>صورة شخصية:</label><input type="file" id="profilePicture" accept="image/*" required></div>
        <div class="form-group"><label>الاسم:</label><input type="text" id="fullName" readonly style="background-color:#333;"></div>
        <div class="form-group"><label>العمر:</label><input type="number" id="age" required></div>
        <div class="form-group"><label>سنوات الخبرة:</label><input type="number" id="experience" required></div>
        <div id="roleSpecificFields"></div>
        <div class="form-group"><label>نبذة:</label><textarea id="about" rows="4" required></textarea></div>
        <button type="submit" class="btn-submit">✅ إرسال البيانات</button>
    </form>
    <div id="statusBox"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
import { getDatabase, ref, get, set, update } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-database.js";
const firebaseConfig = { apiKey: "AIzaSyDpVqFWJfB4rA2-NA4QIl1w07e2LFQaYic", authDomain: "tourguideapp-313c1.firebaseapp.com", databaseURL: "https://tourguideapp-313c1-default-rtdb.firebaseio.com", projectId: "tourguideapp-313c1", storageBucket: "tourguideapp-313c1.firebasestorage.app", messagingSenderId: "1036127588385", appId: "1:1036127588385:web:d144dba8f70fe094395360" };
const app = initializeApp(firebaseConfig); const db = getDatabase(app);
const ROLES = { GUIDE:{key:"GUIDE", name:"مرشد سياحي"}, COMPANION:{key:"COMPANION", name:"مرافق"}, DRIVER:{key:"DRIVER", name:"سائق"} };
const urlParams = new URLSearchParams(window.location.search); const roleKey = urlParams.get('role'); const appId = urlParams.get('appId');
let currentApp = null;
document.addEventListener('DOMContentLoaded', async () => {
    if(!roleKey || !appId){ const box = document.getElementById('statusBox'); box.style.display='block'; box.style.backgroundColor='var(--red)'; box.textContent='❌ خطأ في الرابط.'; document.getElementById('completionForm').style.display='none'; return; }
    try{ const snapshot = await get(ref(db, 'jobApplications')); if(snapshot.exists()){ const apps = snapshot.val(); currentApp = Object.values(apps).find(app => app.id === appId); if(!currentApp) throw new Error('❌ لم يتم العثور على الطلب.'); document.getElementById('fullName').value = currentApp.fullName || ''; document.getElementById('pageTitle').textContent = `استكمال: ${ROLES[roleKey].name}`; document.getElementById('roleInfo').textContent = `رقم الطلب: ${appId}`; renderRoleFields(roleKey); } else throw new Error('❌ لا توجد بيانات.'); } catch(err){ const box=document.getElementById('statusBox'); box.style.display='block'; box.style.backgroundColor='var(--red)'; box.textContent=err.message; document.getElementById('completionForm').style.display='none'; }
});
function previewImage(file){ return new Promise((resolve)=>{ const reader = new FileReader(); reader.onload=function(){ document.getElementById('imagePreview').src=reader.result; resolve(reader.result); }; reader.readAsDataURL(file); }); }
document.getElementById('profilePicture').addEventListener('change', async (e)=>{ await previewImage(e.target.files[0]); });
function renderRoleFields(roleKey){
    const container=document.getElementById('roleSpecificFields'); let html='';
    if(roleKey==='GUIDE'){ html=`<div class="form-group"><label>نوع الإرشاد:</label><select id="guideType" required><option value="ثقافي">ثقافي</option><option value="ترفيهي">ترفيهي</option><option value="ديني">ديني</option><option value="تجاري">تجاري</option></select></div><div class="form-group"><label>حد المجموعة:</label><input type="number" id="groupLimit"></div><div class="form-group"><label>سعر اليوم:</label><input type="number" id="price"></div>`; }
    else if(roleKey==='COMPANION'){ html=`<div class="form-group"><label>التخصص:</label><select id="specialization" required><option value="سمعي">سمعي</option><option value="بصري">بصري</option><option value="حركي">حركي</option><option value="كبار سن">كبار سن</option></select></div><div class="form-group"><label>سعر اليوم:</label><input type="number" id="priceDay"></div><div class="form-group"><label>سعر الساعة:</label><input type="number" id="priceHour"></div>`; }
    else if(roleKey==='DRIVER'){ html=`<div class="form-group"><label>أجرة المدينة:</label><input type="number" id="cityPrice"></div><div class="form-group"><label>أجرة خارج المدينة:</label><input type="number" id="outCityPrice"></div>`; }
    container.innerHTML=html;
}
document.getElementById('completionForm').addEventListener('submit', async (e)=>{
    e.preventDefault(); const submitButton = e.target.querySelector('button[type="submit"]'); submitButton.disabled=true;
    const statusBox = document.getElementById('statusBox'); statusBox.style.display='block'; statusBox.style.backgroundColor='var(--blue-royal)'; statusBox.textContent='⏳ جاري المعالجة...';
    try{
        if(!appId) throw new Error('❌ رقم الطلب مفقود.');
        const fileInput = document.getElementById('profilePicture'); const imgDataURL = await previewImage(fileInput.files[0]);
        let assistantData={ appId: appId, name: document.getElementById('fullName').value.trim(), age: parseInt(document.getElementById('age').value), experience: parseInt(document.getElementById('experience').value), about: document.getElementById('about').value.trim(), img: imgDataURL };
        if(roleKey==='GUIDE'){ assistantData.guideType=document.getElementById('guideType').value; assistantData.groupLimit=parseInt(document.getElementById('groupLimit').value)||0; assistantData.price=parseInt(document.getElementById('price').value)||0; }
        else if(roleKey==='COMPANION'){ assistantData.specialization=document.getElementById('specialization').value; assistantData.priceDay=parseInt(document.getElementById('priceDay').value)||0; assistantData.priceHour=parseInt(document.getElementById('priceHour').value)||0; }
        else if(roleKey==='DRIVER'){ assistantData.cityPrice=parseInt(document.getElementById('cityPrice').value)||0; assistantData.outCityPrice=parseInt(document.getElementById('outCityPrice').value)||0; }
        const pathMap = { GUIDE:'assistants_guides', COMPANION:'assistants_companions', DRIVER:'assistants_drivers' };
        await set(ref(db, `${pathMap[roleKey]}/${appId}`), assistantData);
        const appsSnapshot = await get(ref(db,'jobApplications')); if(appsSnapshot.exists()){ const appsData = appsSnapshot.val(); const appKey = Object.keys(appsData).find(k => appsData[k].id===appId); if(appKey) await update(ref(db,'jobApplications/'+appKey), {status:'تم الاكتمال'}); }
        statusBox.style.backgroundColor='var(--green)'; statusBox.innerHTML=`✅ تم الحفظ! كود الشات: <strong>${appId}</strong><br><button onclick="window.location.href='assistant_login.html'" style="margin-top:10px;padding:8px 12px;background:var(--gold);border:none;border-radius:4px;font-weight:bold;cursor:pointer;">تسجيل الدخول كمساعد</button>`;
    } catch(err){ statusBox.style.backgroundColor='var(--red)'; statusBox.textContent='❌ خطأ: '+err.message; }
    submitButton.disabled=false;
});
</script>
</body>
</html>
