<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المدير</title>
    <style>
:root {
    --bg-dark: #121212;
    --bg-card: #1f1f1f;
    --gold: #ffc107;
    --blue-royal: #4a6fa5;
    --text-light: #e0e0e0;
    --red: #cf6679;
    --border: #333;
}
* { box-sizing: border-box; margin:0; padding:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body {
    background-color: var(--bg-dark);
    color: var(--text-light);
    margin: 0;
    padding: 0;
    min-height: 100vh;
}
.header-controls {
    display: flex;
    justify-content: flex-end;
    padding: 15px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
}
.btn-back {
    background-color: var(--blue-royal);
    color: #fff;
    padding: 8px 15px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-left: 10px;
    font-weight: bold;
    text-decoration: none;
    transition: background-color 0.3s;
}
.btn-back:hover {
    background-color: #3b5b82;
}
.btn-danger {
    background-color: var(--red);
    color: #fff;
}
.btn-danger:hover {
    background-color: #b71c1c;
}
.container {
    max-width: 1200px;
    margin: 20px auto;
    padding: 0 20px;
}
.manager-layout {
    display: flex;
    gap: 20px;
    margin-top: 20px;
}
.sidebar {
    width: 250px;
    background-color: var(--bg-card);
    padding: 15px;
    border-radius: 8px;
    border: 1px solid var(--blue-royal);
    flex-shrink: 0;
}
.sidebar h2 {
    border-bottom: 2px solid var(--gold);
    padding-bottom: 10px;
    margin-bottom: 20px;
    color: var(--gold);
    font-size: 1.3em;
}
.sidebar a {
    display: block;
    padding: 12px 10px;
    margin-bottom: 8px;
    border-radius: 6px;
    text-decoration: none;
    color: var(--text-light);
    background-color: #2a2a2a;
    transition: all 0.3s;
    font-weight: bold;
    border: 1px solid transparent;
}
.sidebar a:hover {
    background-color: var(--blue-royal);
    border-color: var(--gold);
    transform: translateX(-3px);
}
.sidebar a.red-link {
    background-color: var(--red);
}
.sidebar a.red-link:hover {
    background-color: #b71c1c;
}
.main-content {
    flex-grow: 1;
    background-color: var(--bg-card);
    padding: 30px;
    border-radius: 8px;
    border: 1px solid var(--border);
}
.main-content h1 {
    color: var(--gold);
    margin-bottom: 20px;
}
.main-content p {
    color: #aaa;
    margin-bottom: 30px;
}
@media (max-width: 768px) {
    .manager-layout {
        flex-direction: column;
    }
    .sidebar {
        width: 100%;
    }
}
    </style>
</head>
<body>
    <div class="header-controls">
        <button onclick="logoutManager()" class="btn-back btn-danger">🚪 تسجيل الخروج</button>
    </div>

    <div class="container manager-layout">
        <div class="sidebar">
            <h2>📋 قائمة الإدارة</h2>
            <a href="assistants_admin.html">👤 إدارة المساعدين</a>
            <a href="requests_list.html">📝 طلبات التوظيف</a>
            <a href="content_manager.html">🏢 إدارة الأماكن</a>
            <a href="ticket_manager.html">🎟️ أكواد التذاكر</a>
            <a href="emergency_logs.html" class="red-link">🚨 سجل الطوارئ</a>
            <a href="manager_complaints.html" class="red-link">📧 الشكاوى والاقتراحات</a>
        </div>

        <div class="main-content">
            <h1>مرحباً بك يا مدير النظام!</h1>
            <p>استخدم القائمة الجانبية للوصول إلى أدوات الإدارة المختلفة.</p>
            <div style="margin-top: 50px; text-align: center; opacity: 0.5;">
                <span style="font-size: 3em;">🛠️</span>
                <p style="color: #666;">لوحة التحكم الرئيسية</p>
            </div>
        </div>
    </div>

    <script>
        function logoutManager() {
            if (confirm("هل أنت متأكد من تسجيل الخروج من لوحة التحكم؟")) {
                // يمكن إضافة تنظيف للجلسة هنا
                window.location.href = 'login_manager.html';
            }
        }
    </script>
</body>
</html>
