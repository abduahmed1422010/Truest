<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>البوت السياحي</title>
<style>
:root { --bg-dark:#121212; --card-bg:#1f1f1f; --gold:#ffc107; --blue-royal:#4a6fa5; --text:#e0e0e0; --border:#333; }
body { margin:0; background:var(--bg-dark); color:var(--text); font-family:Arial; }
.chat-container { display:flex; flex-direction:column; height:100vh; max-width:800px; width:100%; margin:0 auto; background:#1a1a1a; }
.chat-header { background:var(--blue-royal); color:#fff; padding:15px; text-align:center; font-size:1.3em; display:flex; justify-content:center; align-items:center; position:relative; border-bottom:2px solid var(--gold); }
#exitButton { position:absolute; left:15px; top:50%; transform:translateY(-50%); background:transparent; border:none; font-size:1.5em; color:#fff; cursor:pointer; }
.chat-messages { flex:1; overflow-y:auto; padding:15px; background:#1e1e1e; height:60vh; }
.message { max-width:85%; margin-bottom:12px; padding:12px 18px; border-radius:18px; word-wrap:break-word; line-height:1.5; }
.user-message { background:var(--gold); color:#000; align-self:flex-end; margin-left:auto; border-bottom-left-radius:4px; }
.bot-message { background:#2a2a2a; color:var(--text); align-self:flex-start; margin-right:auto; border-bottom-right-radius:4px; border:1px solid var(--blue-royal); }
.bot-message strong { color:var(--gold); display:block; margin-bottom:5px; }
.message-time { display:block; font-size:0.7em; color:#aaa; margin-top:5px; text-align:left; }
.chat-input { display:flex; padding:10px; background:#1f1f1f; border-top:1px solid var(--border); }
.chat-input input { flex:1; padding:12px; border-radius:20px; border:none; background:#2a2a2a; color:#fff; margin-left:10px; }
.chat-input button { background:var(--blue-royal); border:none; color:#fff; padding:12px 18px; border-radius:50%; cursor:pointer; }
.quick-replies { display:flex; overflow-x:auto; gap:10px; padding:10px; background:#2a2a2a; border-top:1px solid var(--border); }
.quick-reply-btn { flex:0 0 auto; background:var(--card-bg); color:var(--gold); border:1px solid var(--gold); padding:10px 18px; border-radius:20px; cursor:pointer; white-space:nowrap; }
.quick-reply-btn:hover { background:var(--gold); color:#000; }
</style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header"><button id="exitButton" onclick="window.location.href='main_services.html'">✖️</button><span>🤖 البوت السياحي</span></div>
    <div id="chatMessages" class="chat-messages">
        <div class="message bot-message"><strong>مرحباً!</strong><p>اسأل عن المعالم أو استخدم الأزرار السريعة.</p><span class="message-time">الآن</span></div>
    </div>
    <div id="quickReplies" class="quick-replies"></div>
    <div class="chat-input">
        <input type="text" id="messageInput" placeholder="اسأل البوت...">
        <button onclick="sendMessage()">▶️</button>
    </div>
</div>
<script>
const messagesDiv=document.getElementById('chatMessages'), input=document.getElementById('messageInput'), quickDiv=document.getElementById('quickReplies');
const appQuestions=["كيف أحجز سائق؟","كيف أحجز مرشد؟","كيف أبلغ عن شكوى؟","كيف أستخدم البرنامج؟"];
const landmarks=["برج خليفة","دبي مول","نافورة دبي","جامع الشيخ زايد","متحف اللوفر","جزيرة ياس"];
function populateQuickReplies(){ quickDiv.innerHTML=''; [...appQuestions,...landmarks].forEach(text=>{ const btn=document.createElement('button'); btn.className='quick-reply-btn'; btn.textContent=text; btn.onclick=()=>handleQuickReply(text); quickDiv.appendChild(btn); }); }
async function fetchWikipedia(query){ try{ const res=await fetch(`https://ar.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`); const data=await res.json(); return data.extract||"لا توجد معلومات."; } catch(e){ return "حدث خطأ."; } }
function appResponse(msg){ const m=msg.toLowerCase(); if(m.includes('سائق')) return 'اذهب للخدمات الرئيسية > خدمات التنقل.'; if(m.includes('مرشد')) return 'اذهب للخدمات الرئيسية > المرشدين.'; if(m.includes('شكوى')) return 'اضغط زر "شكوى/اقتراح" في الرئيسية.'; if(m.includes('استخدام')) return 'تصفح الخدمات، احجز، أو أرسل شكوى.'; return null; }
function addMessage(sender,text){ const time=new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); const div=document.createElement('div'); div.className='message '+(sender==='user'?'user-message':'bot-message'); div.innerHTML=(sender==='bot'?'<strong>🤖 البوت</strong>':'')+`<p>${text}</p><span class="message-time">${time}</span>`; messagesDiv.appendChild(div); messagesDiv.scrollTop=messagesDiv.scrollHeight; }
function handleQuickReply(q){ addMessage('user',q); setTimeout(()=>sendBotMessage(q),300); }
function sendMessage(){ const t=input.value.trim(); if(!t)return; addMessage('user',t); input.value=''; setTimeout(()=>sendBotMessage(t),300); }
async function sendBotMessage(msg){ const resp=appResponse(msg); if(resp){ addMessage('bot',resp); } else { const wiki=await fetchWikipedia(msg); addMessage('bot',wiki); } }
input.addEventListener('keypress',e=>{ if(e.key==='Enter') sendMessage(); });
populateQuickReplies();
</script>
</body>
</html>
