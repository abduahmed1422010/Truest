<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الفنادق</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h1 { margin-top: 100px; }
        .hotel-form { max-width: 600px; }
        .stars-rating {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }
        .stars-rating label {
            font-size: 1.5em;
            cursor: pointer;
            color: #555;
            transition: color 0.2s;
        }
        .stars-rating input[type="radio"] {
            display: none;
        }
        .stars-rating input[type="radio"]:checked ~ label,
        .stars-rating label:hover,
        .stars-rating label:hover ~ label {
            color: var(--gold);
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="header-controls">
            <a href="manager-dashboard.html" class="btn-back">🔙 لوحة التحكم</a>
            <select class="lang-select" onchange="window.location.hash=this.value">
                <option value="ar">العربية (AR)</option>
                <option value="en">English (EN)</option>
                <option value="gr">Ελληνικά (GR)</option>
            </select>
        </div>
    </header>

    <h1>إضافة فندق جديد</h1>

    <form id="addHotelForm" class="hotel-form">
        <input type="text" name="name" placeholder="اسم الفندق" required>
        <input type="text" name="location" placeholder="الموقع / المدينة" required>
        <input type="text" name="map_link" placeholder="رابط الموقع على الخريطة" required>
        
        <label>السعر (في الليلة / الشهر / الخ..)</label>
        <input type="text" name="price_night" placeholder="مثال: 300 AED / ليلة" required>
        
        <label>تصنيف النجوم</label>
        <div class="stars-rating" dir="ltr">
            <input type="radio" id="star5" name="stars" value="5" required><label for="star5">★</label>
            <input type="radio" id="star4" name="stars" value="4"><label for="star4">★</label>
            <input type="radio" id="star3" name="stars" value="3"><label for="star3">★</label>
            <input type="radio" id="star2" name="stars" value="2"><label for="star2">★</label>
            <input type="radio" id="star1" name="stars" value="1"><label for="star1">★</label>
        </div>

        <label>الإقامة تشمل (وجبات، خدمات، الخ..)</label>
        <textarea name="includes" placeholder="مثال: إفطار مجاني، موقف سيارات، واي فاي" rows="3" required></textarea>

        <button type="submit" class="btn btn-primary" style="width: 100%;">🏨 حفظ الفندق</button>
    </form>
    
    <div id="hotelResult" style="margin-top: 15px; max-width: 600px;"></div>

    <footer>
        جميع الحقوق محفوظة ل© عبدالرحمن احمد
    </footer>

    <script>
        // حماية الصفحة
        if (localStorage.getItem('managerLoggedIn') !== 'true') {
            window.location.href = 'manager.html';
        }

        document.getElementById('addHotelForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = document.getElementById('addHotelForm');
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());
            const hotelResult = document.getElementById('hotelResult');

            // إضافة بيانات الدخول للتحقق في الباك إند
            data.username = 'Abdu';
            data.password = '1422010';
            
            hotelResult.classList.remove('success', 'error');
            hotelResult.innerHTML = '⏳ جاري الحفظ...';

            try {
                const res = await fetch('/api/hotels', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    hotelResult.className = 'success';
                    hotelResult.innerHTML = result.message;
                    form.reset();
                } else {
                    hotelResult.className = 'error';
                    hotelResult.innerHTML = result.message;
                }
            } catch (error) {
                hotelResult.className = 'error';
                hotelResult.innerHTML = '❌ فشل الاتصال بالسيرفر.';
            }
        });
    </script>
</body>
</html>
